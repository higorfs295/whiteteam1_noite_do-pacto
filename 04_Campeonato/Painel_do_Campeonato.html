<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Campeonato · Noite do Pacto</title>
<style>
:root{--ink:#0E1318;--navy:#12324A;--txt:#18222D;--mut:#5A6673;--pan:#F1F3F5;--brd:#DCE2E8;--amb:#F0B44C;--ambd:#94600E;--hl:#FBE3B0;--red:#D2423E;--blue:#2C74C9;--wt:#566676}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--txt);font-family:"Titillium Web","Segoe UI",Roboto,Arial,sans-serif}
.app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh}
header{display:flex;align-items:center;gap:20px;padding:6px 28px;background:var(--ink);color:#F3F1EC}
header .t{font-weight:700;font-size:20px;letter-spacing:.04em}
header .t small{display:block;font-size:13px;color:#C3CCD5;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.score{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:20px}
.score .box{display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:10px;background:#1B2A38}
.score .n{font-size:32px;font-weight:700;line-height:1;min-width:44px;text-align:center}
.score .red .n{color:#FF8A85}.score .blue .n{color:#8CC0FF}
.score button{background:none;border:1px solid #44505D;color:#C3CCD5;border-radius:6px;font-size:14px;padding:2px 7px;cursor:pointer}
nav.steps{display:flex;gap:6px;padding:6px 28px;background:#F7F6F1;border-bottom:1px solid var(--brd);flex-wrap:wrap}
nav.steps button{border:1px solid var(--brd);background:#fff;border-radius:999px;padding:4px 14px;font-size:15px;cursor:pointer;color:var(--mut);font-family:inherit}
nav.steps button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{padding:14px 28px;overflow:auto}
footer{display:flex;gap:10px;align-items:center;padding:6px 28px;border-top:1px solid var(--brd);background:#fff}
.btn{font-family:inherit;font-size:18px;font-weight:700;padding:8px 18px;border-radius:10px;border:none;cursor:pointer;background:var(--navy);color:#fff}
.btn.amb{background:var(--amb);color:var(--ink)}.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.kick{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ambd)}
h1{margin:0 0 4px;font-size:28px;color:var(--navy);line-height:1.1}
.cena{font-size:21px;line-height:1.3;background:#FFF6E3;border-left:6px solid var(--amb);padding:8px 16px;border-radius:8px;margin:4px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.side{border-radius:14px;padding:10px 16px;background:var(--pan);border:2px solid transparent}
.side.red{border-color:var(--red)}.side.blue{border-color:var(--blue)}
.who{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.spr{width:50px;height:66px;background:#1B2A38;border-radius:8px;display:flex;align-items:center;justify-content:center}
.spr img{width:46px;image-rendering:pixelated}
.who b{font-size:24px;color:var(--navy);display:block}.who span{font-size:15px;font-weight:700;letter-spacing:.06em}
.red .who span{color:var(--red)}.blue .who span{color:var(--blue)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--brd);border-radius:10px;padding:6px 12px;margin:5px 0;cursor:pointer;font-family:inherit;font-size:19px;color:var(--txt)}
.opt .l{font-size:24px;font-weight:700;min-width:32px;height:32px;border-radius:8px;background:var(--pan);display:flex;align-items:center;justify-content:center;color:var(--navy)}
.opt.sel{border-color:var(--navy);background:#EAF0F5}.opt.sel .l{background:var(--navy);color:#fff}
.opt.good{border-color:#23926A;background:#E8F6EF}.opt.bad{border-color:#C9CFD6;opacity:.7}
.dice{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:22px}
.d20{width:52px;height:52px;border-radius:14px;background:var(--ink);color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tot{font-size:34px;font-weight:700;color:var(--navy)}
.who .dice{margin-top:0;font-size:20px}.who .dice span{font-size:20px;color:var(--txt);letter-spacing:0;font-weight:400}.who .dice span.tot{font-size:30px;font-weight:700;color:var(--navy)}
.res{margin-top:8px;padding:8px 16px;border-radius:12px;font-size:26px;font-weight:700;text-align:center}
.res .why{margin-top:4px}
.res.r{background:#FDE8E7;color:#9B2A26}.res.b{background:#E5EFFB;color:#1F548F}
.why{font-size:18px;color:var(--mut);margin-top:4px;font-weight:400;line-height:1.35}
.timer{font-size:28px;font-weight:700;color:var(--navy);min-width:90px;text-align:center}
.rules li{font-size:28px;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:20px}td,th{border:1px solid var(--brd);padding:10px 14px;text-align:left}th{background:var(--navy);color:#fff}
tr.pick{background:#FFF6E3;font-weight:700}tr{cursor:pointer}
.big{font-size:64px;font-weight:700;color:var(--navy)}
.les{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}.les div{background:var(--pan);border-radius:12px;padding:16px;font-size:22px}
.les b{display:block;color:var(--navy);margin-bottom:6px}
.note{font-size:16px;color:var(--mut)}
.spike{display:inline-block;background:var(--red);color:#fff;border-radius:8px;padding:4px 10px;font-size:18px;font-weight:700}
@media (max-height:740px){.cena{font-size:19.5px;margin:2px 0 8px}h1{font-size:26px}.opt{font-size:18px;padding:5px 10px;margin:4px 0}.spr{width:44px;height:58px}.spr img{width:40px}.d20{width:48px;height:48px;font-size:28px}.res{font-size:24px}.why{font-size:17px}main{padding:8px 28px}}
@media (max-width:1100px){.opt{font-size:16px}.cena{font-size:18px}.who b{font-size:20px}.res{font-size:22px}.why{font-size:15.5px}footer .note{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="t"><small>UrutauSec · White Team 1</small>Campeonato da Noite do Pacto</div>
  <div class="score" aria-live="polite">
    <div class="box red"><button onclick="adj('r',-1)" aria-label="Tirar um ponto do Red">−</button><span>RED</span><span class="n" id="sr">0</span><button onclick="adj('r',1)" aria-label="Dar um ponto ao Red">+</button></div>
    <div class="box blue"><button onclick="adj('b',-1)" aria-label="Tirar um ponto do Blue">−</button><span class="n" id="sb">0</span><span>BLUE</span><button onclick="adj('b',1)" aria-label="Dar um ponto ao Blue">+</button></div>
  </div>
</header>
<nav class="steps" id="steps"></nav>
<main id="main"></main>
<footer>
  <button class="btn ghost" onclick="go(cur-1)">Anterior</button>
  <button class="btn ghost" onclick="timer()">1 minuto</button><span class="timer" id="tm"></span>
  <span class="note" style="margin-left:auto">Bônus: jogada boa +3 · empate é da defesa · ajuste manual no placar com − e +</span>
  <button class="btn" onclick="go(cur+1)">Próximo</button>
</footer>
</div>

 {t:"Desarmar",site:"Site B · Casa das Bombas",vava:"desarmar a spike",cena:"Lá embaixo, a Dona Ivone ouve uma bomba cantar errado. Ela não confia na tela: desce a escada pra ver com os próprios olhos.",
  red:"doc",blue:"ivone",ro:["Segurar a posição e registrar cada passo.","Repetir o plano mesmo com tudo mudando."],rg:0,
  bo:["Descer até a casa de bombas e conferir no campo.","Esperar o painel avisar."],bg:0,
  wr:"Registro é o que transforma ataque em lição. Rigidez é o defeito do Doc.",wb:"A Dona Ivone ouve a bomba e confere no campo, como na história."}
];
const STEPS=["O Pacto","Round 1","Round 2","Round 3","Round 4","O bilhete","Veredito"];
let st={cur:0,sr:0,sb:0,pick:{},res:{},spike:false,bil:-1};
function save(){try{localStorage.setItem("pacto_painel",JSON.stringify(st))}catch(e){}}
try{const o=JSON.parse(localStorage.getItem("pacto_painel")||"null"); if(o) st=o;}catch(e){}
let cur=st.cur;
const $=id=>document.getElementById(id);
function score(){ $("sr").textContent=st.sr; $("sb").textContent=st.sb; }
function adj(t,d){ if(t==="r") st.sr+=d; else st.sb+=d; score(); save(); }
function roll(){ const a=new Uint32Array(1); crypto.getRandomValues(a); return 1+(a[0]%20); }
function nav(){ $("steps").innerHTML=STEPS.map((s,i)=>`<button class="${i===cur?'on':''}" onclick="go(${i})">${s}</button>`).join(""); }
function go(i){ if(i<0||i>=STEPS.length) return; cur=i; st.cur=i; save(); nav(); render(); window.scrollTo(0,0); }
function who(k,extra){ const p=PEOPLE[k]; return `<div class="who"><div class="spr"><img src="${SP[k]}" alt=""></div><div><b>${p[0]}</b><span>${p[1]}</span></div><div style="margin-left:auto">${extra||""}</div></div>`; }
function render(){
 const m=$("main");
 if(cur===0){ m.innerHTML=`<div class="kick">STARTEX · a Ysolde (Prof. Galvão) lê em voz alta</div><h1>O Pacto desta noite</h1>
  <ol class="rules"><li>Ninguém age fora do Véu.</li><li>Cada grupo só joga no seu round.</li><li>Acordo entre times é proibido.</li><li>Quem gritar “Ferro!” para a noite inteira.</li><li>A Corte de Prata não joga, só julga.</li></ol>
  <p class="note">Como jogar: ouvir a cena · cada grupo da vez levanta a placa A ou B · o painel rola 1d20 pra cada lado. Jogada boa ganha +3. Maior vence; empate é da defesa.</p>
  <button class="btn amb" onclick="go(1)">Começar a noite</button>
  <button class="btn ghost" onclick="if(confirmReset())reset()">Zerar o campeonato</button>`; return; }
 if(cur>=1&&cur<=4){ const n=cur-1, r=R[n]; const pk=st.pick[n]||{}, rs=st.res[n];
  let title=r.t, extra="";
  if(n===3 && !st.spike){ title="Segunda tentativa"; extra=`<p class="note">A spike não foi plantada no round 3: agora o Red tenta de novo. Se o Red vencer, o pendrive vai pro site B.</p>`; }
  if(n===3 && st.spike){ extra=`<p><span class="spike">SPIKE NO SITE B</span> &nbsp;O Blue precisa desarmar. Se o Blue vencer, o pendrive volta.</p>`; }
  const opts=(side,arr,good)=>arr.map((o,i)=>{ let c="opt"; if(pk[side]===i) c+=" sel"; if(rs){ c+= (i===good?" good":" bad"); }
    return `<button class="${c}" ${rs?"disabled":""} onclick="choose(${n},'${side}',${i})"><span class="l">${"AB"[i]}</span><span>${o}${rs&&pk[side]===i?' <em style="color:#94600E;font-size:15px">· escolha do grupo</em>':''}</span></button>`; }).join("");
  const dice=(side)=> rs?`<div class="dice"><div class="d20" id="d${side}">${rs[side].d}</div><span>+ ${rs[side].bon} =</span><span class="tot">${rs[side].d+rs[side].bon}</span></div>`:`<div class="dice"><div class="d20" id="d${side}">?</div></div>`;
  let resHtml="";
  if(rs){ const rw=rs.win==="r"; let spk=""; if(rw && (n===2 || (n===3 && rs.wasPlant))) spk=" Spike plantada no B! O pendrive vai pro site B."; if(!rw && n===3 && rs.hadSpike) spk=" Spike desarmada! O pendrive volta pro site A.";
    resHtml=`<div class="res ${rw?'r':'b'}"><div style="display:flex;align-items:center;justify-content:center;gap:16px"><span>${rw?"Round do RED":"Round do BLUE"}${rs.r.d+rs.r.bon===rs.b.d+rs.b.bon?" (empate é da defesa)":""}.${spk}</span><button class="btn ghost" style="font-size:13px;padding:3px 10px" onclick="undo(${n})">Desfazer</button></div>
     <div class="why"><b>Jogada boa do Red: ${"AB"[r.rg]}.</b> ${r.wr}<br><b>Jogada boa do Blue: ${"AB"[r.bg]}.</b> ${r.wb}</div></div>`; }
  m.innerHTML=`<div class="kick">Round ${n+1} · ${r.site} · <span style="color:#6A50C0">No Vava: ${r.vava}</span></div><h1>${title}</h1><div class="cena">${r.cena}</div>${extra}
   <div class="grid2"><div class="side red">${who(r.red,dice("r"))}${opts("r",r.ro,r.rg)}</div><div class="side blue">${who(r.blue,dice("b"))}${opts("b",r.bo,r.bg)}</div></div>
   ${rs?"":`<div style="margin-top:12px;display:flex;gap:10px;align-items:center"><button class="btn amb" id="rollb" ${(pk.r===undefined||pk.b===undefined)?"disabled":""} onclick="doRoll(${n})">Rolar os dados</button><span class="note">Marque a placa de cada grupo e role.</span></div>`}${resHtml}`; return; }
 if(cur===5){ const rows=[["Bilhete levado à Corte de Prata",-1,1],["Acordo aceito em silêncio",-2,-2],["Bilhete mandado e ignorado",-1,0],["Nenhum bilhete",0,0]];
  m.innerHTML=`<div class="kick">PAUSA · a Ysolde pergunta: um bilhete atravessou a sala. O que dizia?</div><h1>O bilhete da dívida</h1>
  <p class="note">Toque na linha do que aconteceu. Os pontos entram no placar; tocar de novo em outra linha troca o ajuste.</p>
  <table><tr><th>O que aconteceu</th><th>Red</th><th>Blue</th></tr>${rows.map((r,i)=>`<tr class="${st.bil===i?'pick':''}" onclick="bilhete(${i},${r[1]},${r[2]})"><td>${r[0]}</td><td>${r[1]>0?'+':''}${r[1]}</td><td>${r[2]>0?'+':''}${r[2]}</td></tr>`).join("")}</table>
  <p class="cena" style="margin-top:18px">O monitor que acompanhou o Blue: “Fui professor do Lírio. Estou impedido de avaliar esse grupo.”</p>`; return; }
 if(cur===6){ const w=st.sr>st.sb?"Corte do Espinho (Red)":st.sb>st.sr?"Corte da Maré (Blue)":"Empate: ninguém ganhou tudo";
  m.innerHTML=`<div class="kick">Manhã seguinte · a Ysolde lê o placar e assina</div><h1>Veredito</h1>
  <div class="big">RED ${st.sr} × ${st.sb} BLUE</div><p style="font-size:28px;font-weight:700;color:var(--ambd)">${w}</p>
  <div class="les"><div><b>Nota sai de registro</b>Cada ponto tem uma jogada e um dado por trás.</div><div><b>Quem tem vínculo não avalia</b>O Bené se declarou impedido.</div><div><b>A tela pode mentir</b>Confira o processo, não só a tela.</div></div>
  <p class="cena" style="margin-top:18px">O que a Corte de Prata viu que vocês não viram? · O pendrive volta pra Corte de Prata. ENDEX.</p>`; }
}
function choose(n,side,i){ st.pick[n]=st.pick[n]||{}; st.pick[n][side]=i; save(); render(); }
function doRoll(n){ const r=R[n], pk=st.pick[n]; const b=$("rollb"); b.disabled=true; let k=0;
 const iv=setInterval(()=>{ $("dr").textContent=roll(); $("db").textContent=roll(); if(++k>12){ clearInterval(iv); finish(); } },70);
 function finish(){ const res={r:{d:roll(),bon:pk.r===r.rg?3:0},b:{d:roll(),bon:pk.b===r.bg?3:0}};
  res.win=(res.r.d+res.r.bon)>(res.b.d+res.b.bon)?"r":"b";
  res.hadSpike=st.spike;
  if(n===2 && res.win==="r") st.spike=true;
  if(n===3){ if(st.spike){ res.wasPlant=false; if(res.win==="b") st.spike=false; } else { res.wasPlant=true; if(res.win==="r") st.spike=true; } }
  if(res.win==="r") st.sr++; else st.sb++;
  st.res[n]=res; save(); score(); render(); const el=document.querySelector('.res'); if(el) el.scrollIntoView({behavior:'smooth',block:'end'}); }
}
function undo(n){ const rs=st.res[n]; if(!rs) return; if(rs.win==="r") st.sr--; else st.sb--; delete st.res[n];
 if(n===2){ st.spike=false; } if(n===3){ st.spike=!!rs.hadSpike; } save(); score(); render(); }
function bilhete(i,dr,db){ if(st.bil>=0){ const old=[[-1,1],[-2,-2],[-1,0],[0,0]][st.bil]; st.sr-=old[0]; st.sb-=old[1]; } st.bil=i; st.sr+=dr; st.sb+=db; save(); score(); render(); }
function confirmReset(){ return window.confirm ? (function(){try{return confirm("Zerar placar e rounds?")}catch(e){return true}})() : true; }
function reset(){ st={cur:0,sr:0,sb:0,pick:{},res:{},spike:false,bil:-1}; cur=0; save(); score(); nav(); render(); }
let tmI=null; function timer(){ clearInterval(tmI); let t=60; $("tm").textContent="1:00"; tmI=setInterval(()=>{ t--; $("tm").textContent=t>0?("0:"+String(t).padStart(2,"0")):"Tempo!"; if(t<=0) clearInterval(tmI); },1000); }
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight") go(cur+1); if(e.key==="ArrowLeft") go(cur-1); });
score(); nav(); render();
</script>
</body>
</html>
